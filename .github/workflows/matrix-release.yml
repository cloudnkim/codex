name: Codex Matrix 공식 릴리즈 반영

on:
  schedule:
    # 매일 08:00 KST (GitHub 예약 실행은 지연될 수 있음).
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matrix-release
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      update: ${{ steps.release.outputs.update }}
      version: ${{ steps.release.outputs.version }}
      upstream_tag: ${{ steps.release.outputs.upstream_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/matrix-release.py check

  build:
    needs: check
    if: needs.check.outputs.update == 'true'
    runs-on: macos-15
    timeout-minutes: 180
    env:
      VERSION: ${{ needs.check.outputs.version }}
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build native package
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/matrix-release.py build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: matrix-release
          path: .matrix-build/dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [check, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check repository push credential
        env:
          MATRIX_PUSH_KEY: ${{ secrets.MATRIX_PUSH_KEY }}
        run: test -n "$MATRIX_PUSH_KEY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          ssh-key: ${{ secrets.MATRIX_PUSH_KEY }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: matrix-release
          path: .matrix-build/dist/
      - name: Commit version and publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/matrix-release.py publish
